name: Sync target repo on tag

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

concurrency:
  group: sync-target-on-tag
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TARGET_REPO: kt-cloud-ai/ktc-ai-dlc-bluejayA
      TARGET_BRANCH: main

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure branch and tags are up to date
        run: |
          git fetch origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}" --prune
          git fetch origin --tags --force

      - name: Push main branch and current tag to target repository
        env:
          TARGET_PAT: ${{ secrets.TARGET_REPO_PAT }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "${TARGET_PAT}" ]; then
            echo "TARGET_REPO_PAT secret is not set."
            exit 1
          fi

          git remote add target "https://x-access-token:${TARGET_PAT}@github.com/${TARGET_REPO}.git"
          git push --force target "+refs/remotes/origin/${TARGET_BRANCH}:refs/heads/${TARGET_BRANCH}"
          git push --force target "+refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
